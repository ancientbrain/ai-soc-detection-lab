title: PowerShell Encoded Command Execution
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: Detects PowerShell or pwsh launched with any abbreviation of -EncodedCommand
    followed by a Base64 payload. Covers -e, -ec, -en, -enc, and -EncodedCommand.
    The common detection using CommandLine="*-enc*" misses the -e form validated here.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Satwika Maddukuri
date: 2026-11-15
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|re: '(?i)\s[-/](e|ec|en[a-z]*)\s+[A-Za-z0-9+/=]{20,}'
    condition: selection
falsepositives:
    - Legitimate administrative scripts using encoded commands
level: high