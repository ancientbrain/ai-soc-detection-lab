title: Scheduled Task Creation via schtasks.exe
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: Detects schtasks.exe launched with /create argument, indicating a new
    scheduled task is being registered. A common persistence and execution technique.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Satwika Maddukuri
date: 2026-11-15
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    condition: selection
falsepositives:
    - Legitimate administrative scheduled task creation
level: high
