title: Registry Run Key Persistence
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: experimental
description: Detects writes to CurrentVersion\Run or RunOnce registry keys by
    non-system processes, a common persistence mechanism used by attackers.
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: Satwika Maddukuri
date: 2026-11-15
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\CurrentVersion\Run\'
            - '\CurrentVersion\RunOnce\'
    filter_system:
        User|contains:
            - 'NT AUTHORITY'
            - 'SYSTEM'
    filter_edge:
        Image|contains:
            - 'msedge'
            - 'MicrosoftEdge'
    condition: selection and not filter_system and not filter_edge
falsepositives:
    - Software installers adding legitimate startup entries
    - Microsoft Edge auto-launch registration
level: high